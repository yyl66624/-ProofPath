[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "proofpath"
version = "0.1.0"
description = "Evidence-grounded assistant for navigating policy documents and filing applications"
requires-python = ">=3.11"
dependencies = [
    "anthropic==1.4.0",
    "pypdf==6.18.0",
]

[project.optional-dependencies]
# Richer document parsing (PDF/DOCX/PPTX/tables/OCR). Heavy (pulls torch).
#   uv pip install -e ".[docling]"
docling = ["docling==2.126.0"]
# Browser automation for form filling. Requires `playwright install chromium`.
#   uv pip install -e ".[browser]"
browser = ["browser-use==0.13.10"]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0"]

[project.scripts]
proofpath = "proofpath.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/proofpath"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/proofpath"]
